[workspace]
resolver = "2"
members = ["crates/core", "src-tauri"]

# Versions live here so the core crate and the Tauri shell can never drift onto
# two different serde or sqlx. ADR-0015 splits the crates; it does not split the
# dependency graph.
[workspace.dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
# Task 013's two, and both are confined to `schedule::cron` (seam-contract D24).
#
# `croner` is the only maintained cron crate with *defined* DST semantics: its
# searches move in real time rather than wall-clock time, which is what makes
# ADR-0010's "a nightly schedule shows the correct next fire time across a DST
# boundary" answerable at all. `cron 0.17`'s behaviour inside a skipped hour is
# unspecified, and `saffron` hands the timezone question back to the caller,
# which this task's Notes forbid. Its own README calls the API "subject to
# change", so it is reachable from exactly one file — one file plus its tests is
# the whole cost of swapping it.
#
# `chrono-tz` supplies the IANA zones the schema's `schedules.timezone` holds,
# and `TZ_VARIANTS` is what feeds the picker — so the frontend needs **no** npm
# timezone package, which is the dependency D6 would otherwise have had to weigh.
croner = "4"
chrono-tz = "0.10"
# Task 018's one doctor check that std cannot answer: free space on the volume
# the app data directory lives on. Cross-platform, which is the point — ADR-0002
# keeps Windows and Linux viable, and a hand-rolled `statvfs` here would be three
# implementations. The import is confined to `doctor::checks::disk_space`, and
# seam-contract D19 records both the dependency and that constraint.
fs4 = { version = "0.13", default-features = false }
# Task 010's MCP server (ADR-0006, seam-contract D16). `reqwest` is here for
# `mcp::probe` — rmcp's own client transport, so the Test connection round trip
# cannot disagree with the server about the wire format — with no TLS features:
# the probe only ever talks to 127.0.0.1 over http.
reqwest = { version = "0.13", default-features = false }
rmcp = { version = "3.1.4", default-features = false, features = [
  "server",
  "macros",
  "transport-streamable-http-server",
  "client",
  "transport-streamable-http-client",
  "transport-streamable-http-client-reqwest",
] }
# A direct dependency rather than `rmcp::schemars`: the 1.x derive emits
# fully-qualified `::schemars::` paths, so going through the re-export would
# need `#[schemars(crate = "rmcp::schemars")]` on every request and response
# struct.
# `chrono04` so a `DateTime<Utc>` in a response DTO has a schema.
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "chrono",
  "uuid",
  "macros",
  "migrate",
] }
# Task 022, ADR-0020: the forge token goes in the OS keychain, and there is no
# hand-rollable version of three platform secret stores. All three backends are
# enabled because "cross-platform is a requirement of this task, not a
# follow-up" — `apple-native` (macOS Keychain), `windows-native` (Credential
# Manager) and `sync-secret-service` (libsecret over D-Bus). The sync
# secret-service backend rather than the async one: `CredentialStore` is called
# from `spawn_blocking`, and an async backend would drag a second runtime
# concern into a crate that already has one.
#
# It compiles on a headless Linux box and *fails at runtime* without a running
# secret service, which is a real user state and why `status` reports "no
# keychain on this machine" as its own answer rather than as a failed save.
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
  # Encrypted D-Bus transport for the secret-service backend, in pure Rust
  # rather than through OpenSSL: `crypto-openssl` would put a system library on
  # the Linux build's critical path for a feature this app reaches once per
  # spawn.
  "crypto-rust",
] }
# The `http.https://github.com/.extraheader` value is
# `Basic base64("x-access-token:" + token)`. Already in `Cargo.lock`
# transitively through `reqwest`, so promoting it to a direct dependency costs
# no new tree — see seam-contract D25 for why an encoder was not hand-rolled.
base64 = "0.22"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
