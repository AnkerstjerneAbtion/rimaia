[package]
name = "rimaia"
version = "0.1.0"
description = "Rimaia desktop app"
authors = ["you"]
edition = "2021"

# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
[lib]
name = "rimaia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# The shell. Window, state wiring, logging, and command handlers that marshal
# arguments into `rimaia-core` and nothing else (ADR-0015). If a rule shows up in
# this crate, it is in the wrong one — the MCP server cannot reach it here.
[dependencies]
rimaia-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Native folder picker for task 003's "Settings → Repositories → add" (ADR-0002).
tauri-plugin-dialog = "2"
# Task 013's optional OS notification: the queue starting at 22:00 and the run
# window closing at 06:00 both happen with nobody at the machine, and a desktop
# notification is the only surface that reaches somebody who is not looking at
# the window. Seam-contract D6's list is closed, so this is an amendment to it,
# not an addition nobody wrote down.
tauri-plugin-notification = "2"

# Only for the date-range filter `commands::runs::list_runs` deserializes — the
# workspace pin, so the shell and core can never decode a `DateTime<Utc>` two
# different ways.
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
