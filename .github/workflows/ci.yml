name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Belongs to the `shell` job by subject (it's about the Tauri
      # command wiring), but it's placed here, first, on purpose: it reads
      # src-tauri/src/lib.rs and src/lib/commands.ts as plain text, so it
      # needs no Rust toolchain, no apt packages, and no `npm ci` — nothing
      # this job installs below. Running it before any of that gives the
      # fastest possible signal for the one gap ADR-0015 admits no E2E test
      # covers: a command registered in only one of lib.rs's two
      # `generate_handler!` lists.
      - name: Check Tauri command wiring
        run: ./scripts/check-command-wiring.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

  core:
    name: Core (logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy -p rimaia-core --all-targets -- -D warnings

      - name: Test
        run: cargo test -p rimaia-core

  shell:
    name: Tauri shell (check only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri 2 needs these to compile on Linux. Not needed for the `core` job,
      # which is exactly why the crate split in ADR-0015 exists.
      #
      # libayatana-appindicator3-dev only: it Conflicts with the older
      # libappindicator3-dev, and requesting both makes apt fail outright.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check workspace
        run: cargo check --workspace --all-targets
