name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Belongs to the `shell` job by subject (it's about the Tauri
      # command wiring), but it's placed here, first, on purpose: it reads
      # src-tauri/src/lib.rs and src/lib/commands.ts as plain text, so it
      # needs no Rust toolchain, no apt packages, and no `npm ci` — nothing
      # this job installs below. Running it before any of that gives the
      # fastest possible signal for the one gap ADR-0015 admits no E2E test
      # covers: a command registered in only one of lib.rs's two
      # `generate_handler!` lists.
      - name: Check Tauri command wiring
        run: ./scripts/check-command-wiring.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # The only job that compiles the CSS. `typecheck` is `tsc --noEmit` and
      # vitest's jsdom never runs PostCSS, so before this step a stylesheet that
      # could not parse still went green — three PRs shipped one that broke the
      # app at launch, on a comment whose text contained `*/`.
      - name: Build
        run: npm run build

  core:
    # Task 022, ADR-0002: "cross-platform is a requirement of this task, not a
    # follow-up". Compiling the three keychain backends and the environment
    # building code on all three platforms is the only thing that keeps that
    # promise true after the next change to it — and `cargo test -p rimaia-core`
    # has to pass on each of them **with no keychain, no D-Bus and no unlocked
    # login session**, which is what `testing::credentials::MemoryStore` is for.
    name: Core (logic) — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing is a fact worth having about that platform, not a
      # reason to stop learning about the other two.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Installs rustup, not the compiler this job actually runs: rust-toolchain.toml
      # names an exact channel, and rustup's shim honours a toolchain file over the
      # `rustup default` this action sets. The first `cargo` below fetches that
      # version and the rustfmt and clippy the file asks for. Bump the version there,
      # never here — one source of truth is the entire point, and a version named in
      # two places is a version that disagrees with itself.
      - uses: dtolnay/rust-toolchain@stable

      # `keyring`'s `sync-secret-service` backend links libdbus, which is the
      # one system package this crate needs anywhere — and only on Linux.
      # ADR-0015's "no display server, WebKit or GTK" is untouched: libdbus is
      # none of those, and nothing here opens a session bus at build time.
      - name: Install the D-Bus headers the secret-service backend links
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      # Both are platform-independent, so three copies of the same lint buys
      # nothing. Linux only, deliberately (task 022's own CI note).
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy -p rimaia-core --all-targets -- -D warnings

      # Verbatim what CLAUDE.md documents, on every platform. No feature flag
      # and no `--no-default-features`: the invocation that diverges from the
      # documented one is the invocation nobody runs locally.
      - name: Test
        run: cargo test -p rimaia-core

  shell:
    name: Tauri shell (check only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri 2 needs these to compile on Linux. Not needed for the `core` job,
      # which is exactly why the crate split in ADR-0015 exists.
      #
      # libayatana-appindicator3-dev only: it Conflicts with the older
      # libappindicator3-dev, and requesting both makes apt fail outright.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file

      # Same as the `core` job: rust-toolchain.toml decides the version, this only
      # guarantees a rustup that can fetch it.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check workspace
        run: cargo check --workspace --all-targets
