[package]
name = "rimaia-server"
version = "0.1.0"
edition = "2021"
description = "The Rimaia board over HTTP, and its binary (ADR-0027, ADR-0034)."

# The board's HTTP door: `POST /api/v1/<name>` for every board row of
# `rimaia_core::api::registry`, through `api::dispatch`. It never links the
# runner (ADR-0027 point 6), no desktop-framework crate, and no `sqlx`: it
# reaches the store only through `rimaia-core`, and holds no query macro and no
# `.sqlx/` (seam-contract D33 point 2). `rimaia_server_does_not_depend_on_rimaia_runner`
# and `scripts/check-crate-boundaries.sh` hold it to that. Every crate D34 gives
# a later task (`axum-extra`, `sha2`, `rand`, `subtle`, `clap`) arrives with
# that task.

[dependencies]
rimaia-core = { path = "../core" }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true, features = ["trace"] }
tracing = { workspace = true }

# `rimaia-core` again, with `testing` on, for `TwoTeams`, `FixedCaller` and the
# board case table. `reqwest` is the workspace line, which already speaks plain
# HTTP to 127.0.0.1, so the contract suite drives a real listener without a
# crate entering the lock (seam-contract D6, D34).
[dev-dependencies]
rimaia-core = { path = "../core", features = ["testing"] }
pretty_assertions = "1"
reqwest = { workspace = true }
tempfile = { workspace = true }
