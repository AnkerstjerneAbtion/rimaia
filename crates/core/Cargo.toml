[package]
name = "rimaia-core"
version = "0.1.0"
edition = "2021"
description = "Rimaia orchestration logic. Free of any desktop-shell dependency (ADR-0015)."

# Nothing here may require a display server, WebKit or GTK. `cargo test -p
# rimaia-core` has to run on a bare machine — that is the whole point of the
# split, and task 001 asserts it by grepping this file for the framework's name.
# If a task wants the desktop framework in this list, the design is being
# violated, not a dependency missing.
[features]
# Compiles the `testing` module — the clock, temp-repo, in-memory-database and
# fixture helpers (ADR-0015, task 019). Off by default so a release build never
# links `tempfile`; the self-referencing dev-dependency below turns it on for
# `cargo test`.
testing = ["dep:tempfile"]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
croner = { workspace = true }
fs4 = { workspace = true }
keyring = { workspace = true }
reqwest = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# Depending on ourselves with `testing` on is the supported way to make a
# feature-gated helper module visible to `tests/` without making it visible to
# consumers of the published library. Cargo unifies the feature into the
# unit-test build too, so plain `cargo test -p rimaia-core` is enough.
[dev-dependencies]
rimaia-core = { path = ".", features = ["testing"] }
pretty_assertions = "1"
# Task 022's integration test recomputes the `extraheader` value the way the
# production code does, so the two cannot agree by copying a literal.
base64 = { workspace = true }
tokio-test = "0.4"
